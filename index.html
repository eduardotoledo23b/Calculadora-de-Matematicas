<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Matemática Dark</title>
    <style>
        /* === NUEVO DISEÑO (CSS) === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Geneva, Verdana, sans-serif;
        }

        body {
            /* Fondo de pizarra con matemáticas */
            background-image: url('https://images.unsplash.com/photo-1596496050827-8299e0220de1?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator-card {
            background-color: rgba(30, 41, 59, 0.95); /* Color oscuro casi opaco */
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0px 15px 35px rgba(0,0,0,0.6);
            color: #f1f5f9; /* Texto claro */
            backdrop-filter: blur(5px);
        }

        h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #cbd5e1;
            font-size: 14px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            background-color: #334155; /* Fondo de input oscuro */
            border: 1px solid #475569;
            color: #ffffff;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: #94a3b8;
        }
        
        /* Ocultar flechas del input number */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            border: none;
            padding: 12px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:hover, .btn-clear:hover {
            opacity: 0.9;
        }

        .btn:active, .btn-clear:active {
            transform: scale(0.97);
        }

        /* Colores basados en tu imagen de referencia */
        .btn-suma { background-color: #ea580c; } /* Naranja */
        .btn-resta { background-color: #059669; } /* Verde oscuro */
        .btn-multi { background-color: #7c3aed; } /* Morado */
        .btn-div { background-color: #2563eb; } /* Azul */

        .btn-clear {
            width: 100%;
            border: none;
            margin-top: 15px;
            padding: 12px;
            background: linear-gradient(to right, #06b6d4, #2563eb); /* Degradado cyan a azul */
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #resultado-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #1e293b; /* Caja de resultado más oscura */
            border: 1px solid #334155;
            border-radius: 8px;
            text-align: center;
            display: none; /* Oculto al inicio */
            color: #ffffff;
        }
        
        #resultado-box h3 {
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h2>📊 Calculadora Matemática</h2>
        
        <div class="input-group">
            <label>Primer Número:</label>
            <input type="number" id="num1" placeholder="Primer Número">
        </div>

        <div class="input-group">
            <label>Segundo Número:</label>
            <input type="number" id="num2" placeholder="Segundo Número">
        </div>

        <div class="buttons-grid">
            <button onclick="calcular('suma')" class="btn btn-suma">➕ Suma</button>
            <button onclick="calcular('resta')" class="btn btn-resta">➖ Resta</button>
            <button onclick="calcular('multiplicacion')" class="btn btn-multi">✖ Multiplicación</button>
            <button onclick="calcular('division')" class="btn btn-div">➗ División</button>
        </div>

        <button onclick="limpiar()" class="btn-clear">🔄 Limpiar</button>

        <div id="resultado-box">
            <h3>Resultado: <span id="resultado">0</span></h3>
        </div>
    </div>

    <script>
        // === JAVASCRIPT ===
        function calcular(operacion) {
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);
            const resultadoBox = document.getElementById('resultado-box');
            const resultadoText = document.getElementById('resultado');

            if (isNaN(num1) || isNaN(num2)) {
                alert("Por favor, ingrese ambos números.");
                return;
            }

            let resultado = 0;

            switch (operacion) {
                case 'suma': resultado = num1 + num2; break;
                case 'resta': resultado = num1 - num2; break;
                case 'multiplicacion': resultado = num1 * num2; break;
                case 'division': 
                    if (num2 === 0) {
                        alert("No se puede dividir entre cero.");
                        return;
                    }
                    resultado = num1 / num2; 
                    break;
            }

            // Mostrar máximo 2 decimales si no es entero
            resultadoText.innerText = Number.isInteger(resultado) ? resultado : resultado.toFixed(2);
            resultadoBox.style.display = "block";
        }

        function limpiar() {
            document.getElementById('num1').value = "";
            document.getElementById('num2').value = "";
            document.getElementById('resultado-box').style.display = "none";
        }
    </script>
</body>
</html>
